<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .card-panel { grid-column: 1 / -1; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; }
    .card-actions { width: 260px; }
    #notice { color: #355b38; font-weight: 800; min-height: 1.2em; margin: 6px 0; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; }
    .badge.draft { background: #e8dcc8; color: #6b5a3e; }
    .badge.confirmed { background: #355b38; color: #fff; }
    .badge.void { background: #a03a2e; color: #fff; }
    .problems p { margin: 4px 0; }
    .totals { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .queue { display: grid; gap: 4px; margin-top: 8px; max-height: 420px; overflow: auto; }
    .queue-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px dashed #e1d5c5; padding: 4px 0; }
    .row-no { width: 64px; flex: none; color: #76695e; font-size: 13px; }
    .seg { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d9cdbc; border-radius: 6px; padding: 3px 8px; background: #fff; font-size: 13px; }
    .seg .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .seg em { font-style: normal; color: #76695e; }
    .seg.lift-warn { border-color: #a03a2e; background: #fbeae7; }
    .archive-item { border-bottom: 1px solid #e1d5c5; padding: 6px 0; font-size: 13px; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，统计色线用量，生成上机织造卡。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
    <section class="panel card-panel">
      <div class="card-head">
        <h2>上机织造卡</h2>
        <div class="toolbar card-actions">
          <button id="buildCardBtn">生成织造卡</button>
          <button id="confirmCardBtn" class="secondary" disabled>确认卡片</button>
        </div>
      </div>
      <div id="notice"></div>
      <div id="cardStatus"></div>
      <div id="cardProblems" class="problems"></div>
      <div id="cardTotals" class="totals"></div>
      <div id="cardQueue" class="queue"></div>
      <h2>作废留档</h2>
      <div id="cardArchive"></div>
    </section>
  </main>
  <script src="js/weave-card.js"></script>
  <script src="js/card-archive.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
